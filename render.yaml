# Deploy the whole repository so the frontend and API share one origin.
# Existing dashboard services must also use the repository root and these commands.
services:
  - type: web
    name: investor-verdict
    runtime: node
    branch: main
    buildCommand: npm ci --include=dev && npm --prefix frontend/confidence-panel ci --include=dev && npm run build
    startCommand: node deploy/server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID_CTO
        sync: false
      - key: ELEVENLABS_AGENT_ID_TECH_BRO
        sync: false
      - key: ELEVENLABS_AGENT_ID_INTERROGATOR
        sync: false
      - key: ELEVENLABS_AGENT_ID_SYMPATHIZER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_COACH_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_COACH_REASONING_EFFORT
        value: medium
